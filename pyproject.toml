[project]
name = "locomo-dynamic-memory"
version = "0.1.0"
description = "Local, evidence-backed dynamic conversation memory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.18,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "rank-bm25==0.2.2",
  "streamlit>=1.40,<2",
  "nltk>=3.9,<4",
]

[project.optional-dependencies]
embedding = ["sentence-transformers==6.1.0", "torch==2.14.1+cpu"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locomo_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_model: explicit opt-in paid DeepSeek integration check", "local_embedding: opt-in real cached MiniLM load and encoding"]
