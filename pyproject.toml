[project]
name = "locomo-dynamic-memory"
version = "0.1.0"
description = "Local, evidence-backed dynamic conversation memory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.18,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "streamlit>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locomo_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
