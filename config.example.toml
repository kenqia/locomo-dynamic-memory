# Copy to a local file and set LOCOMO_CONFIG to its path. No credentials belong here.
db_path = "var/memory.sqlite3"
api_url = "http://127.0.0.1:8000"
model_name = "deepseek-flash"
model_base_url = "https://api.deepseek.com"
model_timeout_seconds = 60
model_retries = 2
model_temperature = 0
model_max_tokens = 8192
# Optional relation-only override, recorded in the build fingerprint.
# relation_max_tokens = 16384
thinking_enabled = false
# Legacy global field remains false; each operation uses its own effort below.
extraction_thinking_effort = "disabled"
relation_thinking_effort = "high"
query_analysis_thinking_effort = "disabled"
resolution_thinking_effort = "low"
answer_thinking_effort = "disabled"
embedding_model = "sentence-transformers/all-MiniLM-L6-v2"
embedding_revision = "c9745ed1d9f207416be6d2e6f8de32d1f16199bf"
embedding_dimensions = 384
embedding_local_files_only = true
embedding_max_tokens = 256
fragment_turns = 20
bm25_k = 20
dense_k = 20
initial_k = 20
rrf_constant = 60
expansion_max_candidates = 60
expansion_depth = 1
expansion_scan_limit = 200
relation_history_limit = 20
relation_same_key_fraction = 0.8
relation_fact_fraction = 0.5
candidate_token_budget = 12000
evidence_token_budget = 6000
raw_max_hits = 3
raw_neighbor_turns = 1
raw_max_turns = 9
raw_token_budget = 2000
resolution_input_budget = 12000
